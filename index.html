<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASE NOTE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

       <!-- HEADER -->
<header class="header">

    <div class="header-left">
        <h1 class="logo">CASE NOTE</h1>

        <div class="tabs">
            <button id="noteTabBtn" class="tab-btn active">
                Note
            </button>

            <button id="historyTabBtn" class="tab-btn">
                History
            </button>
        </div>
    </div>

    <div class="clock-wrapper">

        <div class="clock-card">
            <div class="clock-label">PH</div>
            <div id="phTime" class="clock-time"></div>
        </div>

        <div class="clock-card">
            <div class="clock-label">CST</div>
            <div id="ctTime" class="clock-time"></div>
        </div>

    </div>

</header>
        <!-- NOTE TAB -->

       <section id="noteTab" class="card">

   
<h2 class="section-title">DEL SET</h2>

<div class="form-row">
    <div class="form-group">
        <label>Spoke With <span class="required">*</span></label>
        <select id="spokeWith">
            <option value="">Select an option</option>
            <option>Patient</option>
            <option>Spouse</option>
            <option>Child</option>
            <option>Sibling</option>
            <option>MD Office</option>
            <option>Other</option>
        </select>
    </div>

    <div class="form-group">
        <label>Caller's Name <span class="required">*</span></label>
        <input type="text" id="callerName" placeholder="Enter complete name">
    </div>
</div>

<div id="otherRelationshipContainer" style="display:none;">
    <label>Other Relationship *</label>
    <input type="text" id="otherRelationship">
</div>

<div class="form-group">
    <label>Office Hours <span class="field-note">(If Office-Based)</span></label>
    <input type="text" id="mdOfficeHours" placeholder="Enter office hours or N/A">
</div>

<div class="form-row">
    <div class="form-group">
        <label>PUNR <span class="required">*</span></label>
        <select id="punr">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="form-group">
        <label>Delivery Date <span class="required">*</span></label>
        <input type="date" id="deliveryDate">
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Medication <span class="required">*</span></label>
        <input type="text" id="medicationName" placeholder="Medication name">
    </div>

    <div class="form-group">
        <label>Copay / AR Bal <span class="required">*</span></label>
        <input type="text" id="copay" placeholder="Amount or N/A">
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>OBE Needed? *</label>
        <select id="obeNeeded">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
            <option>N/A</option>
        </select>
    </div>

    <div class="form-group">
        <label>Is There an Active OBE? *</label>
        <select id="activeObe">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
            <option>N/A</option>
        </select>
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Is the Current Address the Same w/ Previous Order? *</label>
        <select id="sameAddress">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="form-group" id="addressReasonContainer" style="display:none;">
        <label>Reason for Address Change *</label>
        <input type="text" id="addressChangeReason">
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Shipping to MDO? *</label>
        <select id="shipToMdo">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="form-group">
        <label>If Ship to MDO, Is It the Same MD on the Rx? *</label>
        <select id="sameMd">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
            <option>N/A</option>
        </select>
    </div>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Is the Insurance Under Medicaid? *</label>
        <select id="medicaid">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="form-group">
        <label>Shipping Method *</label>
        <select id="shippingMethod">
            <option value="">Select an option</option>
            <option>Signature Required</option>
            <option>No Signature Required</option>
            <option>Other</option>
        </select>
    </div>
</div>

<div id="otherShippingContainer" style="display:none;">
    <label>Specify Shipping Method *</label>
    <input type="text" id="otherShippingMethod">
</div>

<div class="form-group">
    <label>Shipping Address <span class="required">*</span></label>
    <textarea id="shippingAddress" placeholder="Complete shipping address"></textarea>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Is the Medication a Growth Hormone? *</label>
        <select id="growthHormone">
            <option value="">Select an option</option>
            <option>No</option>
            <option>Yes</option>
        </select>
    </div>

    <div class="form-group">
        <label>Is the State CO, ID, MN, NV, RI, or WV? *</label>
        <select id="restrictedState">
            <option value="">Select an option</option>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>
</div>

<div class="form-group">
    <label>Medication Cost <span class="required">*</span></label>
    <input type="text" id="medicationCost" placeholder="Enter medication cost or N/A">
</div>

<div class="form-group">
    <label>Remarks</label>
    <textarea id="remarks" placeholder="Additional notes (optional)"></textarea>
</div>

<div class="reminder-box">
    <strong>Shipping Reminder:</strong><br>
    CO, ID, MN, NV, RI, and WV require Signature Required (SIG Req).
</div>

<div class="attestation">
    <label>
        <input type="checkbox" id="attestation">
        I attest that I have verified with the patient that there are no changes to the insurance on file.
    </label>
</div>

<div class="button-row">
    <button id="copyNoteBtn" class="btn btn-copy" disabled>
        Copy Note
    </button>

    <button id="clearBtn" class="btn btn-clear">
        Clear Form
    </button>
</div>


<!-- STANDARD NOTE -->

<hr class="section-divider">

<h2 class="section-title">
    STANDARD CASE NOTE
</h2>

<div class="form-row">

    <div class="form-group">

        <label>
            Caller's Name
            <span class="required">*</span>
        </label>

        <input
            type="text"
            id="stdCaller"
            placeholder="Enter caller's name">

    </div>

    <div class="form-group">

        <label>
            Relationship to Patient / Title
            <span class="required">*</span>
        </label>

        <input
            type="text"
            id="stdRelationship"
            placeholder="Patient, Spouse, RN, MD, Office Staff, etc.">

    </div>

</div>

<div class="form-group">

    <label>
        Medication Name
        <span class="required">*</span>
    </label>

    <input
        type="text"
        id="stdMedication"
        placeholder="Enter medication name">

</div>

<div class="form-group">

    <label>
        Issue / Reason for Call
        <span class="required">*</span>
    </label>

    <textarea
        id="stdIssue"
        placeholder="Document reason for call"></textarea>

</div>

<div class="form-group">

    <label>
        Resolution / Outcome
        <span class="required">*</span>
    </label>

    <textarea
        id="stdResolution"
        placeholder="Document resolution or outcome"></textarea>

</div>

<div class="button-row">

    <button
        id="copyStandardBtn"
        class="btn btn-copy">

        Copy Standard

    </button>

    <button
        id="clearStandardBtn"
        class="btn btn-clear">

        Clear Standard

    </button>

</div>
            
</section>


        <!-- HISTORY TAB -->

        <section
            id="historyTab"
            class="card hidden">

            <div id="historyContainer">

                <div class="empty-history">
                    No saved case notes yet.
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
